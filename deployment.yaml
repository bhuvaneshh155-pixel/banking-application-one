apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app
  labels:
    app: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking
  template:
    metadata:
      labels:
        app: banking
    spec:
      containers:
      - name: banking-api
        image: banking-app:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: IfNotPresent

apiVersion: v1
kind: Service
metadata:
  name: banking-service
spec:
  selector:
    app: banking
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
